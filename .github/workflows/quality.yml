name: Quality gates
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hasslab
          POSTGRES_USER: hasslab
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hasslab"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      SECRET_KEY: isolated-ci-key-not-for-production-409c5853
      POSTGRES_DB: hasslab
      POSTGRES_USER: hasslab
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_HOST: localhost
      DJANGO_SETTINGS_MODULE: config.ci_settings
      REDIS_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pip check
      - run: python backend/manage.py check
      - run: python backend/manage.py makemigrations --check --dry-run
      - run: python backend/manage.py migrate --noinput
      - run: pytest --ds=config.ci_settings -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: frontend/playwright-report
          retention-days: 5
  training-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hasslab
          POSTGRES_USER: hasslab
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hasslab"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      SECRET_KEY: isolated-ai-ci-key-not-for-production-75360913
      POSTGRES_DB: hasslab
      POSTGRES_USER: hasslab
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_HOST: localhost
      DJANGO_SETTINGS_MODULE: config.ci_settings
      REDIS_INTEGRATION: '1'
      AI_SMOKE: '1'
      AI_DEVICE: cpu
      AI_BASE_WEIGHTS_DIR: ${{ github.workspace }}/storage/base-weights
      AI_SMOKE_REPORT: ${{ github.workspace }}/storage/ai-smoke-report.json
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements/*.lock
      - uses: actions/cache@v4
        with:
          path: storage/base-weights
          key: yolov8n-official-ultralytics-8.4.183
      - run: pip install -r backend/requirements/worker-cpu.lock
      - run: pip check
      - run: python -c "from importlib.metadata import packages_distributions; assert packages_distributions()['cv2'] == ['opencv-python-headless']"
      - run: pytest backend/tests/test_training_smoke.py --ds=config.ci_settings -q
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ai-technical-smoke
          path: storage/ai-smoke-report.json
          retention-days: 5
